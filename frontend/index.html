<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />

    <!-- WHAT A CRAWLER AND A LINK PREVIEW SEE.
         Before this, the entire head was charset, viewport and a one-word
         title: no description, no canonical, no social card. Google had nothing
         to write a result snippet from, so it would have invented one from
         whatever text it found, and every link shared to WhatsApp or Discord
         rendered as a bare URL.

         This is a single-page app, so these are the ONLY tags a crawler gets —
         they are served identically for every route, and the router swaps the
         view client-side afterwards. That is the honest limit of SEO here:
         almost the whole product is behind Clerk, and the public surface is
         this page plus the two legal documents. -->
    <title>ALOP-AI — Seven AI models answer. One reply.</title>
    <meta
      name="description"
      content="ALOP-AI puts your question to a council of seven AI models, each tuned to a different temperature, then reconciles their answers into one reply — and tells you where they disagreed."
    />
    <link rel="canonical" href="https://alop-ai.com/" />

    <!-- THE ICON WAS NEVER DECLARED. public/favicon.svg has existed the whole
         time and nothing linked it, so every browser fell back to its default
         guess of /favicon.ico — which does not exist — and every page load
         logged a 404. The file was fine; the one line pointing at it was
         missing.

         AND IT POINTED AT THE WRONG MARK. favicon.svg was a purple lightning
         bolt with no relation to this product — an artefact of whatever
         scaffold this started from, in a colour the design system does not
         contain. It has been deleted rather than left in public/ for someone
         to re-link. favicon.png is generated from logo.png by
         scripts/render-og.mjs: the penguin on the brand tile, because the
         mark is white line-art and vanishes on a light tab bar without it.

         144, AND THE NUMBER IS A REQUIREMENT. Google only considers a favicon
         for a search result if it is a square whose side is a multiple of 48.
         This shipped at 128, which is not one, so the result row fell back to
         the generic globe — the site looked like it belonged to nobody. Both
         this and the size attribute are generated by render-og.mjs; change it
         there, not here.

         apple-touch-icon is logo-mark.png rather than logo.png for the same
         reason the favicon is: logo.png is a #040404 square with the bird
         drawn nearly black inside it, so as a home-screen icon it is a black
         tile. -->
    <link rel="icon" href="/favicon.png" type="image/png" sizes="144x144" />
    <link rel="apple-touch-icon" href="/logo-mark.png" />

    <!-- Google Search Console ownership proof.
         Public by design — this token only asserts control of this document,
         grants nothing, and is meant to be readable by anyone. It is not a
         credential and does not belong in an env var.

         It verifies the URL-PREFIX property (https://alop-ai.com/), NOT a
         Domain property. Domain properties can only be verified by DNS TXT,
         which is why the first attempt failed: the tag was never going to
         satisfy it. Keep this tag — Google re-checks periodically and removing
         it silently unverifies the property. -->
    <meta name="google-site-verification" content="gu9-m7GaF7fd5Q5Mgmdly5G5B2b3OXyOf8gu-5UuUto" />
    <meta name="theme-color" content="#1b120c" />
    <meta name="color-scheme" content="dark light" />

    <!-- Open Graph / Twitter.
         This was logo.png, which is 721x720. Every platform crops a large
         summary card to 1.91:1, so a square image was letterboxed or
         centre-cropped and a shared link showed a padded logo. og.png is a
         purpose-built 1200x630 card generated from public/og.svg — see that
         file for how to regenerate it.

         The declared width and height matter: without them some clients fetch
         the image before deciding whether to render a large card at all, and a
         slow first fetch means the small card is chosen instead. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ALOP-AI" />
    <meta property="og:url" content="https://alop-ai.com/" />
    <meta property="og:title" content="ALOP-AI — Seven AI models answer. One reply." />
    <meta
      property="og:description"
      content="A council of seven AI models answers separately, then has to agree. You get the reconciled reply — and where they disagreed."
    />
    <meta property="og:image" content="https://alop-ai.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ALOP-AI — seven AI models, each at a different temperature, answering as a council." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ALOP-AI — Seven AI models answer. One reply." />
    <meta
      name="twitter:description"
      content="A council of seven AI models answers separately, then has to agree. You get the reconciled reply — and where they disagreed."
    />
    <meta name="twitter:image" content="https://alop-ai.com/og.png" />

    <!-- Structured data: tells Google that a thing called "ALOP-AI" exists and
         that this domain is it.

         This is the last technical lever available for a brand query. Ranking
         for your own name is not won with tags — it is won when Google has
         enough corroboration to believe the name maps to the domain. Schema is
         the part of that we control; the rest is external mentions.

         Deliberately NO `offers` block. Prices are stated in the Terms, and a
         second copy here would be a second thing to keep true. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://alop-ai.com/#organization",
            "name": "ALOP-AI",
            "url": "https://alop-ai.com/",
            "logo": "https://alop-ai.com/logo-mark.png",
            "email": "privacy@alop-ai.com"
          },
          {
            "@type": "WebSite",
            "@id": "https://alop-ai.com/#website",
            "url": "https://alop-ai.com/",
            "name": "ALOP-AI",
            "alternateName": "ALOP AI",
            "description": "A council of seven AI models answers separately, then reconciles into one reply.",
            "publisher": { "@id": "https://alop-ai.com/#organization" }
          }
        ]
      }
    </script>
    <!-- Connection setup starts here, in the HTML, because these run while the
         JS bundle is still downloading. A preconnect opens DNS + TCP + TLS
         ahead of the first request, which is worth 100-300ms per origin on a
         cold connection — and the API and Clerk are both on the critical path
         to a signed-in screen.

         The API origin is hardcoded rather than templated from VITE_API_BASE:
         index.html is not processed for env vars, and this value is already
         public in the shipped bundle. If the backend ever moves, this line
         moves with it — a stale preconnect is a wasted connection, not a
         broken one. -->
    <link rel="preconnect" href="https://alop-ai.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://alop-ai.onrender.com" />
    <!-- Inter is served from this origin, not from Google. Two reasons, and
         the first is not a performance one: loading it from fonts.googleapis.com
         sent every visitor's IP address to Google before anything rendered, with
         no consent and no way to refuse. A German court awarded damages over
         precisely that in 2022, and it is one of the few GDPR questions with a
         ruling rather than an argument behind it. Self-hosting deletes the
         transfer, so there is no longer a third party to disclose.

         It is also faster. The old pair of preconnects existed because the font
         needed two extra origins on the critical path, and the stylesheet
         request had to complete before the browser could even discover the
         font's URL. Preloading the file directly removes that round trip; the
         `crossorigin` attribute is required even same-origin, because fonts are
         always fetched in CORS mode and without it the preload is discarded and
         fetched a second time. -->
    <link rel="preload" href="/fonts/switzer-400.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
