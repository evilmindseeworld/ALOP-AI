<!--
  Source for og.png, the social preview card. 1200x630 — the size every
  platform crops to for a large summary card.

  The previous og:image was logo.png at 721x720. A square in a 1.91:1 slot gets
  letterboxed or centre-cropped depending on the platform, so a shared link
  showed a padded logo rather than a card. Nothing was broken; it just looked
  like nobody had thought about it.

  WHAT IS ON IT, and why it is not a logo on a gradient. The product's actual
  argument is the temperature ladder: seven models at seven different
  temperatures, which is the reason a council returns something a single model
  does not. That is the one thing on the sign-in page worth putting in a
  preview, and it is checkable rather than atmospheric.

  Colours are the shipped tokens: bg #0a0a0a, primary #f08aa3,
  text #f5f1ee, text-subtle #8d8880. Flat fills only — no gradient, no
  glow, per the design pass in baca269.

  Regenerate (from frontend/):
    npm i --no-save @resvg/resvg-js
    node -e "const{Resvg}=require('@resvg/resvg-js'),f=require('fs');f.writeFileSync('public/og.png',new Resvg(f.readFileSync('public/og.svg','utf8'),{fitTo:{mode:'width',value:1200},font:{loadSystemFonts:true}}).render().asPng())"

  NOT svgexport: it drives headless Chromium and fails to spawn here. resvg
  ships prebuilt binaries and needs no browser. And note that '--' is illegal
  inside an XML comment, which is why the token names above lost their dashes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- One hairline rule, the same idea as the app's borders. -->
  <rect x="0" y="0" width="1200" height="3" fill="#f08aa3"/>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="80" y="132" fill="#8d8880" font-size="22" letter-spacing="4.5" font-weight="600">THE COUNCIL</text>

    <text x="80" y="228" fill="#f5f1ee" font-size="76" font-weight="700" letter-spacing="-2">Seven answers.</text>
    <text x="80" y="316" fill="#f08aa3" font-size="76" font-weight="700" letter-spacing="-2">One reply.</text>

    <text x="80" y="384" fill="#b8b3ae" font-size="26">They disagree on purpose. You get what they agreed on &#8212;</text>
    <text x="80" y="420" fill="#b8b3ae" font-size="26">and where they didn&#8217;t.</text>

    <!-- The ladder, low to high, exactly as the sign-in page orders it. -->
    <g font-size="21" letter-spacing="0.5">
      <text x="80"  y="520" fill="#8d8880">0.2</text>
      <text x="140" y="520" fill="#f5f1ee">The Architect</text>
      <text x="330" y="520" fill="#8d8880">0.3</text>
      <text x="390" y="520" fill="#f5f1ee">The Engineer</text>
      <text x="580" y="520" fill="#8d8880">0.4</text>
      <text x="640" y="520" fill="#f5f1ee">The Analyst</text>
      <text x="830" y="520" fill="#8d8880">0.5</text>
      <text x="890" y="520" fill="#f5f1ee">The Strategist</text>

      <text x="80"  y="562" fill="#8d8880">0.5</text>
      <text x="140" y="562" fill="#f5f1ee">The Scholar</text>
      <text x="330" y="562" fill="#8d8880">0.7</text>
      <text x="390" y="562" fill="#f5f1ee">The Alchemist</text>
      <text x="580" y="562" fill="#8d8880">0.8</text>
      <text x="640" y="562" fill="#f5f1ee">The Explorer</text>
    </g>

    <text x="1120" y="562" fill="#8d8880" font-size="22" text-anchor="end" letter-spacing="1">alop-ai.com</text>
  </g>
</svg>
