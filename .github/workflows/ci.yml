name: CI

# Runs on every push and every PR. Before this existed, 393 frontend tests, 168
# backend tests and a clean build ran only when someone remembered — and this
# repo has a cascade baseline that is regenerated BY HAND, which is exactly the
# kind of guard that rots silently when nothing checks it.
on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: the only run that matters
# is the one for the current head.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 26 is what this is developed against. Pinned rather than
          # 'latest', so a Node release cannot turn a green branch red on its
          # own schedule.
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      # The build is not redundant with the tests. Vite resolves imports and
      # aliases at build time that vitest satisfies from source, so a broken
      # '@/…' path passes every test and fails the deploy.
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # The quoted glob is load-bearing: `node --test lib/` fails on Node 26
      # with MODULE_NOT_FOUND, and unquoted the shell expands it before Node
      # sees it. `npm test` already carries the right form — do not "simplify".
      - run: npm test

  # server.js calls process.exit(1) at import when required env vars are
  # missing, which is why every testable piece lives in lib/. That also means
  # nothing in the suite ever parses server.js itself — the file the whole API
  # runs from. `--check` is parse-only: it catches a syntax error, NOT a bad
  # require() path or anything else that only fails at runtime. Cheap, and it
  # closes the one gap that would otherwise reach production as a boot loop.
  server-parses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: node --check backend/server.js
